name: Deploy Vite site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Le chemin de base suit le nom du depot : renommer le depot suffit.
          # Sans cette ligne, vite.config.ts retombe sur « /salle/ » ecrit en
          # dur, et un renommage donnerait une page blanche sans message.
          SALLE_BASE: /${{ github.event.repository.name }}/

      # Le routeur vit dans le navigateur ; GitHub Pages, lui, ne sert que des
      # fichiers. Sans cette copie, recharger ou partager /salle/progres tombe
      # sur la page 404 de GitHub. La page d'erreur sert donc la coquille, qui
      # lit l'URL et affiche le bon ecran.
      - name: Servir la coquille sur les liens profonds
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
